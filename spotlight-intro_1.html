<title>Spotlight Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#0A1424;
    --bg-2:#0D1B30;
    --surface:#111F38;
    --surface-2:#152744;
    --line:#25375A;
    --line-soft:#1B2C4A;
    --text:#F3F6FC;
    --text-dim:#8CA0C4;
    --text-faint:#5C7099;
    --accent:#FFB238;
    --accent-soft:rgba(255,178,56,0.14);
    --accent-line:rgba(255,178,56,0.4);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
  }

  body{
    font-family:'Manrope',ui-sans-serif,system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(760px 520px at 50% -8%, rgba(255,178,56,0.10), transparent 60%),
      radial-gradient(900px 700px at 100% 110%, rgba(79,140,209,0.08), transparent 55%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  h1,h2,h3{
    font-family:'Big Shoulders Display','Arial Narrow',sans-serif;
    font-weight:800;
    margin:0;
    text-wrap:balance;
    text-transform:uppercase;
    letter-spacing:0.01em;
  }

  #app{
    height:100%;
    display:flex;
    flex-direction:column;
    max-width:640px;
    margin:0 auto;
  }

  /* ---------- topbar ---------- */
  .topbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:18px clamp(16px,4vw,28px) 10px;
  }
  .brand{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
    letter-spacing:0.14em;
    color:var(--text-faint);
    font-weight:600;
    text-transform:uppercase;
  }
  .stepcount{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    letter-spacing:0.04em;
    color:var(--accent);
    font-variant-numeric:tabular-nums;
    font-weight:600;
  }

  .progress{
    flex:0 0 auto;
    height:3px;
    margin:0 clamp(16px,4vw,28px) 4px;
    background:var(--line-soft);
    border-radius:3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    border-radius:3px;
    transition:width .35s ease;
    width:0%;
  }

  /* ---------- stage ---------- */
  .stage{
    flex:1 1 auto;
    overflow-y:auto;
    padding:clamp(18px,5vw,32px) clamp(16px,4vw,28px) 4px;
    display:flex;
    flex-direction:column;
  }
  .stage::-webkit-scrollbar{width:6px;}
  .stage::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  .screen{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
  }

  .kicker{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
    margin-bottom:10px;
  }

  .question{
    font-size:clamp(1.7rem,6.5vw,2.7rem);
    line-height:1.05;
    color:var(--text);
    margin-bottom:22px;
  }

  .field-group{
    display:flex;
    flex-direction:column;
    gap:20px;
    margin-bottom:8px;
  }
  .field label{
    display:block;
    font-size:0.82rem;
    font-weight:700;
    color:var(--text-dim);
    margin-bottom:8px;
    letter-spacing:0.01em;
  }
  .field input,
  .field textarea{
    width:100%;
    font-family:'Manrope',sans-serif;
    font-size:clamp(1.15rem,4.2vw,1.5rem);
    font-weight:600;
    color:var(--text);
    background:var(--surface);
    border:2px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
    outline:none;
    transition:border-color .15s ease, background .15s ease;
    resize:none;
  }
  .field input::placeholder,
  .field textarea::placeholder{
    color:var(--text-faint);
    font-weight:500;
  }
  .field input:focus,
  .field textarea:focus{
    border-color:var(--accent);
    background:var(--surface-2);
  }
  .field textarea{
    min-height:88px;
    line-height:1.35;
  }
  .hint{
    font-size:0.82rem;
    color:var(--text-faint);
    margin-top:8px;
    line-height:1.4;
  }

  /* ---------- suggestions ---------- */
  .suggest-row{
    margin-top:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .suggest-btn{
    align-self:flex-start;
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--accent-soft);
    border:1.5px solid var(--accent-line);
    color:var(--accent);
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:0.88rem;
    padding:10px 16px;
    border-radius:999px;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  .suggest-btn:hover{background:rgba(255,178,56,0.22);}
  .suggest-btn:active{transform:scale(0.97);}
  .suggest-btn:disabled{opacity:0.55;cursor:default;transform:none;}
  .chips{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .chip{
    text-align:left;
    background:var(--surface);
    border:1.5px solid var(--line);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    font-size:0.95rem;
    font-weight:600;
    padding:12px 14px;
    border-radius:12px;
    cursor:pointer;
    line-height:1.35;
    transition:border-color .15s ease, background .15s ease;
  }
  .chip:hover{border-color:var(--accent-line);background:var(--surface-2);}
  .chip .num{color:var(--accent);font-variant-numeric:tabular-nums;}
  .suggest-note{
    font-size:0.8rem;
    color:var(--text-faint);
  }

  /* ---------- nav ---------- */
  .navbar{
    flex:0 0 auto;
    display:flex;
    gap:12px;
    padding:16px 0 clamp(16px,3vh,26px);
  }
  .btn{
    flex:1;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:1rem;
    letter-spacing:0.02em;
    text-transform:uppercase;
    padding:16px 18px;
    border-radius:14px;
    border:none;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{
    background:var(--accent);
    color:#1A1200;
  }
  .btn-primary:disabled{
    opacity:0.35;
    cursor:default;
  }
  .btn-ghost{
    flex:0 0 auto;
    background:transparent;
    border:2px solid var(--line);
    color:var(--text-dim);
    padding:16px 22px;
  }
  .btn-ghost:hover{border-color:var(--text-faint);}
  .btn-wide{flex:1 1 100%;}

  /* ---------- welcome ---------- */
  .welcome{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;
    gap:18px;
  }
  .welcome .kicker{margin-bottom:2px;}
  .welcome h1{
    font-size:clamp(2.4rem,11vw,4.2rem);
    line-height:0.95;
  }
  .welcome h1 span{color:var(--accent);}
  .welcome p{
    font-size:1.05rem;
    color:var(--text-dim);
    line-height:1.55;
    max-width:46ch;
  }
  .welcome .template{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.82rem;
    line-height:1.7;
    color:var(--text-faint);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
  }
  .welcome .template b{color:var(--accent);font-weight:600;}

  /* ---------- reveal ---------- */
  .reveal{
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .reveal-body{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:26px;
  }
  .reveal-loading{
    font-family:'IBM Plex Mono',monospace;
    color:var(--text-faint);
    font-size:0.95rem;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .dot-pulse{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);
    animation:pulse 1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:0.25;transform:scale(0.8);}
    50%{opacity:1;transform:scale(1.15);}
  }
  .full-line{
    font-family:'Big Shoulders Display',sans-serif;
    font-weight:800;
    text-transform:none;
    letter-spacing:0;
    font-size:clamp(1.9rem,7.5vw,3.3rem);
    line-height:1.08;
    text-wrap:balance;
    font-variant-numeric:tabular-nums;
  }
  .full-line .num{color:var(--accent);}
  .short-wrap{
    border-top:1px solid var(--line);
    padding-top:20px;
  }
  .short-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:8px;
    font-weight:600;
  }
  .short-line{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:clamp(1.05rem,3.6vw,1.35rem);
    color:var(--text-dim);
    line-height:1.4;
  }
  .short-line .num{color:var(--accent);}
  .fallback-note{
    font-size:0.78rem;
    color:var(--text-faint);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .error-note{
    font-size:0.85rem;
    color:#FF8A6B;
    background:rgba(255,138,107,0.1);
    border:1px solid rgba(255,138,107,0.3);
    padding:10px 14px;
    border-radius:12px;
  }
  .toast{
    position:absolute;
    left:50%;
    bottom:110px;
    transform:translateX(-50%) translateY(8px);
    background:var(--surface-2);
    border:1px solid var(--accent-line);
    color:var(--text);
    font-size:0.85rem;
    font-weight:700;
    padding:10px 18px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    white-space:nowrap;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (max-width:400px){
    .navbar{flex-wrap:wrap;}
  }
</style>

<div id="app">
  <div class="topbar">
    <span class="brand">WOW OS · FastTrack</span>
    <span class="stepcount" id="stepcount"></span>
  </div>
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  <div class="stage" id="stage"></div>
</div>
<div class="toast" id="toast">Copied to clipboard</div>

<script>
(function(){
  'use strict';

  var STEPS = [
    {
      id:'identity',
      kicker:'Step 1 of 5',
      question:'Who’s speaking?',
      fields:[
        {key:'fullName', label:'Full name', placeholder:'e.g. Rohan Mehta'},
        {key:'designation', label:'Designation', placeholder:'e.g. Founder & CEO'}
      ]
    },
    {
      id:'business',
      kicker:'Step 2 of 5',
      question:'Your business, in brief',
      fields:[
        {key:'company', label:'Company', placeholder:'e.g. Bright Path Interiors'},
        {key:'city', label:'City', placeholder:'e.g. Pune'},
        {key:'teamSize', label:'Team size', placeholder:'e.g. 12'}
      ]
    },
    {
      id:'audience',
      kicker:'Step 3 of 5',
      question:'Who do you help?',
      fields:[
        {key:'icp', label:'Your ideal customer (ICP)', placeholder:'e.g. Boutique hotel owners with under 50 rooms', textarea:true}
      ],
      hint:'Be specific — not “business owners,” but the exact kind you’re built for.'
    },
    {
      id:'outcome',
      kicker:'Step 4 of 5',
      question:'What’s the dream outcome?',
      fields:[
        {key:'dreamOutcome', label:'The result you deliver — put a number on it', placeholder:'e.g. cut project delays by 30%', textarea:true}
      ],
      hint:'A number, a percentage, or a timeframe. “Grow their business” isn’t tangible — “30% revenue growth in 6 months” is.',
      suggestField:'dreamOutcome',
      suggestLabel:'✨ Suggest a number for me'
    },
    {
      id:'promise',
      kicker:'Step 5 of 5',
      question:'What’s your big promise?',
      fields:[
        {key:'bigPromise', label:'The method or number behind it', placeholder:'e.g. our 90-day sprint system', textarea:true}
      ],
      hint:'Name the mechanism — a number, a system, or a guarantee — that makes the outcome believable.',
      suggestField:'bigPromise',
      suggestLabel:'✨ Suggest a method for me'
    }
  ];

  var state = {
    fullName:'', designation:'', company:'', city:'', teamSize:'',
    icp:'', dreamOutcome:'', bigPromise:''
  };

  var result = { full:'', short:'', source:'' }; // source: 'ai' | 'fallback'
  var current = 'welcome'; // 'welcome' | 0..STEPS.length-1 | 'reveal'
  var sampleApi = null;
  var sampleChecked = false;
  var revealBusy = false;
  var revealError = '';

  (function initSample(){
    try{
      if(window.claude && typeof window.claude.use === 'function'){
        window.claude.use('sample').then(function(api){
          sampleApi = api;
          sampleChecked = true;
          if(current !== 'welcome') render();
        }).catch(function(){ sampleApi = null; sampleChecked = true; });
      } else {
        sampleChecked = true;
      }
    }catch(e){ sampleChecked = true; sampleApi = null; }
  })();

  function el(html){
    var t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function highlightNums(s){
    var safe = escapeHtml(s);
    return safe.replace(/(\d[\d,.]*\s?%?)/g, '<span class="num">$1</span>');
  }

  function stepValid(step){
    return step.fields.every(function(f){
      return String(state[f.key] || '').trim().length > 0;
    });
  }

  function goto(target){
    current = target;
    render();
    var stageEl = document.getElementById('stage');
    if(stageEl) stageEl.scrollTop = 0;
  }

  function updateChrome(){
    var stepcount = document.getElementById('stepcount');
    var fill = document.getElementById('progressFill');
    if(typeof current === 'number'){
      stepcount.textContent = ('0'+(current+1)).slice(-2) + ' / 0' + STEPS.length;
      fill.style.width = (((current+1)/STEPS.length)*100) + '%';
    } else if(current === 'reveal'){
      stepcount.textContent = 'DONE';
      fill.style.width = '100%';
    } else {
      stepcount.textContent = '';
      fill.style.width = '0%';
    }
  }

  function render(){
    updateChrome();
    var stage = document.getElementById('stage');
    stage.innerHTML = '';
    if(current === 'welcome') stage.appendChild(renderWelcome());
    else if(current === 'reveal') stage.appendChild(renderReveal());
    else stage.appendChild(renderStep(STEPS[current]));
  }

  function renderWelcome(){
    var wrap = el('<div class="welcome"></div>');
    wrap.innerHTML =
      '<div class="kicker">Introduction Builder</div>' +
      '<h1>Build your<br><span>Spotlight</span> intro.</h1>' +
      '<p>Five quick questions, then a tight, sayable-in-one-breath introduction — built around real numbers, not filler.</p>' +
      '<div class="template">I am <b>[Name]</b>, <b>[Designation]</b> of <b>[Company]</b>, <b>[City]</b>, with a team of <b>[Size]</b>.<br>' +
      'We help <b>[ICP]</b> <b>[Dream Outcome]</b> by <b>[Big Promise]</b>.</div>';
    var nav = el('<div class="navbar"></div>');
    var startBtn = el('<button class="btn btn-primary btn-wide">Start →</button>');
    startBtn.addEventListener('click', function(){ goto(0); });
    nav.appendChild(startBtn);
    wrap.appendChild(nav);
    return wrap;
  }

  function renderStep(step){
    var screen = el('<div class="screen"></div>');

    var head = el('<div></div>');
    head.innerHTML = '<div class="kicker">'+escapeHtml(step.kicker)+'</div><div class="question">'+escapeHtml(step.question)+'</div>';
    screen.appendChild(head);

    var group = el('<div class="field-group"></div>');
    step.fields.forEach(function(f){
      var field = el('<div class="field"></div>');
      var inputHtml = f.textarea
        ? '<textarea id="field-'+f.key+'" placeholder="'+escapeHtml(f.placeholder)+'">'+escapeHtml(state[f.key])+'</textarea>'
        : '<input id="field-'+f.key+'" type="text" placeholder="'+escapeHtml(f.placeholder)+'" value="'+escapeHtml(state[f.key])+'">';
      field.innerHTML = '<label for="field-'+f.key+'">'+escapeHtml(f.label)+'</label>' + inputHtml;
      group.appendChild(field);
      var inputEl = field.querySelector('#field-'+f.key);
      inputEl.addEventListener('input', function(){
        state[f.key] = inputEl.value;
        continueBtn.disabled = !stepValid(step);
      });
      if(!f.textarea){
        inputEl.addEventListener('keydown', function(e){
          if(e.key === 'Enter' && !continueBtn.disabled) continueBtn.click();
        });
      }
    });
    screen.appendChild(group);

    if(step.hint){
      var hint = el('<div class="hint"></div>');
      hint.textContent = step.hint;
      screen.appendChild(hint);
    }

    if(step.suggestField){
      screen.appendChild(renderSuggestBlock(step));
    }

    var spacer = el('<div style="flex:1"></div>');
    screen.appendChild(spacer);

    var nav = el('<div class="navbar"></div>');
    var backBtn = el('<button class="btn btn-ghost">← Back</button>');
    backBtn.addEventListener('click', function(){
      goto(current === 0 ? 'welcome' : current - 1);
    });
    var isLast = current === STEPS.length - 1;
    var continueBtn = el('<button class="btn btn-primary">'+(isLast ? 'Generate my intro →' : 'Continue →')+'</button>');
    continueBtn.disabled = !stepValid(step);
    continueBtn.addEventListener('click', function(){
      if(continueBtn.disabled) return;
      goto(isLast ? 'reveal' : current + 1);
    });
    nav.appendChild(backBtn);
    nav.appendChild(continueBtn);
    screen.appendChild(nav);

    return screen;
  }

  function renderSuggestBlock(step){
    var box = el('<div class="suggest-row"></div>');
    var textareaSelector = '#field-'+step.suggestField;

    if(!sampleChecked){
      return box; // still resolving; nothing to show yet
    }
    if(!sampleApi){
      var note = el('<div class="suggest-note">Type your own number above — AI suggestions aren’t available in this view.</div>');
      box.appendChild(note);
      return box;
    }

    var btn = el('<button class="suggest-btn">'+escapeHtml(step.suggestLabel)+'</button>');
    var chipHost = el('<div class="chips"></div>');
    box.appendChild(btn);
    box.appendChild(chipHost);

    btn.addEventListener('click', function(){
      btn.disabled = true;
      btn.textContent = 'Thinking…';
      chipHost.innerHTML = '';
      buildSuggestPrompt(step).then(function(prompt){
        return sampleApi.json(prompt, { modelTier:'quick' });
      }).then(function(list){
        if(!Array.isArray(list)) list = [];
        chipHost.innerHTML = '';
        list.slice(0,3).forEach(function(s){
          if(typeof s !== 'string' || !s.trim()) return;
          var chip = el('<button type="button" class="chip"></button>');
          chip.innerHTML = highlightNums(s.trim());
          chip.addEventListener('click', function(){
            state[step.suggestField] = s.trim();
            render();
          });
          chipHost.appendChild(chip);
        });
        if(!chipHost.children.length){
          chipHost.innerHTML = '<div class="suggest-note">No suggestions came back — try again, or write your own.</div>';
        }
      }).catch(function(err){
        var code = err && err.code;
        if(code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed'){
          sampleApi = null;
          render();
          return;
        }
        chipHost.innerHTML = '<div class="suggest-note">Couldn’t fetch suggestions right now — try again, or write your own.</div>';
      }).finally(function(){
        btn.disabled = false;
        btn.textContent = step.suggestLabel;
      });
    });

    return box;
  }

  function buildSuggestPrompt(step){
    return Promise.resolve().then(function(){
      var ctx = 'Designation: ' + state.designation + '\n' +
        'Company: ' + state.company + '\n' +
        'City: ' + state.city + '\n' +
        'Team size: ' + state.teamSize + '\n' +
        'They help (ICP): ' + state.icp;
      if(step.suggestField === 'dreamOutcome'){
        return 'You are helping a business owner craft a one-line self-introduction for a live workshop.\n\n' +
          'Context:\n' + ctx + '\n\n' +
          'Suggest exactly 3 short "Dream Outcome" phrases — the tangible result they deliver for that customer. ' +
          'Each MUST contain one concrete number, percentage, or timeframe. 6-14 words each, lowercase start, no trailing period, no quotation marks, no numbering.\n\n' +
          'Reply with only a JSON array of 3 strings, e.g. ["cut project delays by 30%", "...", "..."]';
      }
      return 'You are helping a business owner craft a one-line self-introduction for a live workshop.\n\n' +
        'Context:\n' + ctx + '\n' +
        'Dream outcome: ' + state.dreamOutcome + '\n\n' +
        'Suggest exactly 3 short "Big Promise" phrases — the mechanism, method, or guarantee that makes that outcome happen. ' +
        'Each MUST contain a concrete number, a percentage, or a specific named method (for example "our 90-day sprint system" or "a 3-step vendor-vetting process"). ' +
        '5-12 words each, lowercase start, no trailing period, no quotation marks, no numbering.\n\n' +
        'Reply with only a JSON array of 3 strings.';
    });
  }

  function assembleFallback(){
    var full = 'I am ' + state.fullName + ', ' + state.designation + ' of ' + state.company + ', ' +
      state.city + ', with a team of ' + state.teamSize + '. We help ' + state.icp + ' ' +
      state.dreamOutcome + ' by ' + state.bigPromise + '.';
    var shortIcp = state.icp.split(/\s+/).slice(0,4).join(' ');
    var shortOutcome = state.dreamOutcome.split(/\s+/).slice(0,6).join(' ');
    var short = state.fullName + ' — ' + shortOutcome + ' for ' + shortIcp + '.';
    return { full: full, short: short, source:'fallback' };
  }

  function buildFinalPrompt(){
    return 'Craft a spoken self-introduction for a live business workshop from these facts. Do not invent anything not given, and do not change any numbers.\n\n' +
      'Full name: ' + state.fullName + '\n' +
      'Designation: ' + state.designation + '\n' +
      'Company: ' + state.company + '\n' +
      'City: ' + state.city + '\n' +
      'Team size: ' + state.teamSize + '\n' +
      'Who they serve (ICP): ' + state.icp + '\n' +
      'Dream outcome: ' + state.dreamOutcome + '\n' +
      'Big promise: ' + state.bigPromise + '\n\n' +
      'Write it as exactly one sentence following this shape: "I am [Full Name], [Designation] of [Company], [City], with a team of [Team Size]. We help [ICP] [Dream Outcome] by [Big Promise]."\n\n' +
      'Rules:\n' +
      '- Sayable in one breath, 25-40 words total\n' +
      '- Preserve the Dream Outcome\'s number/percentage and the Big Promise\'s number/method exactly as given\n' +
      '- No filler words like "best", "leading", "world-class", "passionate", "innovative"\n' +
      '- Only tighten grammar and flow — never add claims that weren\'t given\n\n' +
      'Also write a "short" version: an ultra-compact 8-12 word version for a fast-round intro that still includes one number.\n\n' +
      'Reply with only a JSON object shaped exactly like: {"full": "...", "short": "..."}';
  }

  function runReveal(forceRefresh){
    if(!sampleChecked){
      setTimeout(function(){ runReveal(forceRefresh); }, 150);
      return;
    }
    if(!sampleApi){
      result = assembleFallback();
      revealBusy = false;
      render();
      return;
    }
    revealBusy = true;
    revealError = '';
    render();
    var opts = { modelTier:'default' };
    if(forceRefresh) opts.cache = false;
    sampleApi.json(buildFinalPrompt(), opts).then(function(data){
      if(data && typeof data.full === 'string' && data.full.trim()){
        result = {
          full: data.full.trim(),
          short: (typeof data.short === 'string' && data.short.trim()) ? data.short.trim() : assembleFallback().short,
          source:'ai'
        };
      } else {
        result = assembleFallback();
      }
    }).catch(function(err){
      var code = err && err.code;
      if(code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed'){
        sampleApi = null;
      }
      result = assembleFallback();
      revealError = 'Used your exact words — AI polish wasn’t available just now.';
    }).finally(function(){
      revealBusy = false;
      render();
    });
  }

  function renderReveal(){
    var wrap = el('<div class="reveal"></div>');
    var body = el('<div class="reveal-body"></div>');

    if(revealBusy || (!result.full && sampleApi !== null)){
      if(!revealBusy && !result.full){
        // kick off generation on first visit
        setTimeout(function(){ runReveal(false); }, 0);
      }
      body.innerHTML = '<div class="reveal-loading"><span class="dot-pulse"></span> Crafting your intro…</div>';
    } else {
      if(!result.full) result = assembleFallback();
      var full = el('<div class="full-line"></div>');
      full.innerHTML = highlightNums(result.full);
      body.appendChild(full);

      var shortWrap = el('<div class="short-wrap"></div>');
      shortWrap.innerHTML = '<div class="short-label">10-second version</div><div class="short-line">'+highlightNums(result.short)+'</div>';
      body.appendChild(shortWrap);

      if(revealError){
        var errEl = el('<div class="fallback-note"></div>');
        errEl.textContent = revealError;
        body.appendChild(errEl);
      }
    }

    wrap.appendChild(body);

    var nav = el('<div class="navbar"></div>');
    var editBtn = el('<button class="btn btn-ghost">← Edit</button>');
    editBtn.addEventListener('click', function(){ goto(STEPS.length - 1); });
    nav.appendChild(editBtn);

    if(!revealBusy && result.full){
      if(result.source === 'ai'){
        var againBtn = el('<button class="btn btn-ghost">↻ Regenerate</button>');
        againBtn.addEventListener('click', function(){ runReveal(true); });
        nav.appendChild(againBtn);
      }
      var copyBtn = el('<button class="btn btn-primary">Copy</button>');
      copyBtn.addEventListener('click', function(){ copyToClipboard(result.full); });
      nav.appendChild(copyBtn);
    }
    wrap.appendChild(nav);

    if(!revealBusy && result.full){
      var startOver = el('<button class="btn btn-ghost" style="margin-top:-4px;">Start over with someone new</button>');
      startOver.addEventListener('click', function(){
        state = { fullName:'', designation:'', company:'', city:'', teamSize:'', icp:'', dreamOutcome:'', bigPromise:'' };
        result = { full:'', short:'', source:'' };
        revealError = '';
        goto('welcome');
      });
      wrap.appendChild(startOver);
    }

    return wrap;
  }

  function copyToClipboard(text){
    var done = function(){
      var toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(function(){ toast.classList.remove('show'); }, 1600);
    };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    }catch(e){ fallbackCopy(); }
    function fallbackCopy(){
      try{
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      }catch(e2){}
    }
  }

  render();
})();
</script>
